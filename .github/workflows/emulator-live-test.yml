name: Emulator live agent test

on:
  workflow_dispatch:

jobs:
  verify-models:
    name: Verify app models against real Gemini API
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install websocket client
        run: pip install websocket-client

      - name: List Live-capable models + run one real turn per app model
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "SKIP: add repo secret GEMINI_API_KEY to enable the live test."
            exit 0
          fi
          python3 scripts/verify_app_models.py

  emulator-live-e2e:
    name: Real Android emulator E2E (agent must respond)
    needs: verify-models
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK components
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER=sdkmanager
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Build debug APK + instrumented tests
        run: ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace --no-daemon

      - name: KVM permission workaround (GitHub runners intermittently miss the kvm group)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || true

      - name: Boot emulator and run live E2E (real API key)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          emulator-boot-timeout: 900
          # NOTE: android-emulator-runner executes the script LINE BY LINE
          # (each line in its own `sh -c`), so every command below must be a
          # self-contained single line: no if/fi, no multi-line loops, no
          # comments, no line continuations.
          script: |
            adb wait-for-device
            adb shell pm grant com.mobileagent.app android.permission.RECORD_AUDIO || true
            adb shell pm grant com.mobileagent.app android.permission.CALL_PHONE || true
            adb shell pm grant com.mobileagent.app android.permission.READ_CONTACTS || true
            adb shell pm grant com.mobileagent.app android.permission.POST_NOTIFICATIONS || true
            adb shell dumpsys deviceidle whitelist +com.mobileagent.app || true
            ./gradlew connectedDebugAndroidTest --stacktrace --no-daemon -Pandroid.testInstrumentationRunnerArguments.geminiApiKey="$GEMINI_API_KEY" -Pandroid.testInstrumentationRunnerArguments.class=com.mobileagent.app.LiveAgentE2eTest ; EC=$? ; adb logcat -d -v time > "$GITHUB_WORKSPACE/emulator-logcat.txt" ; exit $EC

      - name: Dump emulator logs on failure
        if: failure()
        run: |
          timeout 30 adb devices || true
          timeout 60 adb logcat -d -v time > emulator-logcat.txt || true
          echo "--- LiveAgentE2e / GeminiLiveWebSocket / AgentConversationService log lines ---"
          grep -iE "LiveAgentE2e|GeminiLiveWebSocket|AgentConversation|setupComplete|onError" emulator-logcat.txt | tail -200 || true

      - name: Upload emulator logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-live-logs
          path: |
            emulator-logcat.txt
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
