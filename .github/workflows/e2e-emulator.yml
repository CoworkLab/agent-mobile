name: E2E (emulator)

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  instrumented:
    name: Instrumented tests (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        api-level: [ 34, 30 ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          set -o pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          [ -n "$SDKMANAGER" ] || { echo "sdkmanager not found" >&2; exit 1; }
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -x

            # Install before touching settings. Enabling the accessibility service for a
            # package that is not installed yet is silently dropped, so the order matters.
            ./gradlew installDebug installDebugAndroidTest --stacktrace

            adb shell pm grant com.phoneagent.debug android.permission.POST_NOTIFICATIONS || true
            adb shell appops set com.phoneagent.debug SYSTEM_ALERT_WINDOW allow || true
            adb shell cmd notification allow_listener \
              com.phoneagent.debug/com.phoneagent.service.PhoneAgentNotificationListener || true

            # Write the accessibility settings last, then read them back: if the service
            # component is wrong the tests skip, and a wrong name here is the usual cause.
            adb shell settings put secure enabled_accessibility_services \
              com.phoneagent.debug/com.phoneagent.service.PhoneAgentAccessibilityService
            adb shell settings put secure accessibility_enabled 1

            adb shell settings get secure enabled_accessibility_services
            adb shell settings get secure accessibility_enabled
            adb shell dumpsys accessibility | head -40

            ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Collect logcat
        if: always()
        run: |
          adb logcat -d > logcat-api${{ matrix.api-level }}.txt || true
          adb shell dumpsys accessibility > dumpsys-accessibility-api${{ matrix.api-level }}.txt || true

      - name: Pull perception artifacts
        if: always()
        run: |
          mkdir -p perception-api${{ matrix.api-level }}
          adb pull /sdcard/Android/data/com.phoneagent.debug/files/perception \
            perception-api${{ matrix.api-level }}/ || true
          ls -la perception-api${{ matrix.api-level }}/ || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-api${{ matrix.api-level }}
          path: |
            logcat-api*.txt
            dumpsys-accessibility-api*.txt
            perception-api*/**
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 14
